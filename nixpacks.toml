[phases.setup]
nixPkgs = ["nodejs_22", "git"]

[phases.install]
cmds = ["npm install", "cd frontend && npm install"]

[phases.build]
# The auth values are frozen into the bundle at build time. Changing a Railway
# variable does nothing until the next deploy.
cmds = ["cd frontend && VITE_FP_AUTH_URL=$VITE_FP_AUTH_URL VITE_FP_AUTH_PUBLISHABLE_KEY=$VITE_FP_AUTH_PUBLISHABLE_KEY npm run build"]

[start]
cmd = "npm start"
